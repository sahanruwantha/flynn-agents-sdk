name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.6.13
      - run: uv sync --locked --extra dev
      - run: uv run pytest
      - run: uv run mypy
      - run: uv run ruff check src tests examples scripts
      - run: uv run ruff format --check src tests examples scripts
      - run: uv run python examples/scripted_task.py
      - name: Check release metadata
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python scripts/release_notes.py "v$VERSION"
      - run: uv build
      - name: Test installed wheel outside checkout
        run: |
          uv venv "$RUNNER_TEMP/wheel-env" --python "$(command -v python)"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl pytest httpx
          cp -r tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest wheel-tests/unit wheel-tests/integration
