[project]
name = "flynn-agents-sdk"
version = "0.2.0"
description = "A custom agent runtime for bounded reasoning, tool execution, and evidence-backed state."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["agents", "asyncio", "tool-calling", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
http = ["httpx>=0.28,<1"]
deepseek = ["httpx>=0.28,<1"]
dev = ["httpx>=0.28,<1", "pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flynn_agents_sdk*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.urls]
Repository = "https://github.com/sahanruwantha/flynn-agents-sdk"
Documentation = "https://github.com/sahanruwantha/flynn-agents-sdk/blob/main/docs/README.md"
Issues = "https://github.com/sahanruwantha/flynn-agents-sdk/issues"
Changelog = "https://github.com/sahanruwantha/flynn-agents-sdk/blob/main/CHANGELOG.md"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples"]
